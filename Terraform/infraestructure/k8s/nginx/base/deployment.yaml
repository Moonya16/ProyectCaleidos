apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
      - name: init-custom-page
        image: busybox
        command:
          - sh
          - -c
          - |
            COLOR=$(printf "#%06x" $((RANDOM*RANDOM % 16777215)))
            echo "<!DOCTYPE html>
            <html>
            <head>
              <meta charset='UTF-8'>
              <title>NGINX Load Balancer Demo</title>
              <style>
                body {
                  background-color: ${COLOR};
                  font-family: Arial, Helvetica, sans-serif;
                  color: #222;
                  text-align: center;
                  padding-top: 10%;
                }
                h1 {
                  font-size: 42px;
                  margin-bottom: 20px;
                }
                h2 {
                  font-size: 28px;
                  margin-top: 0;
                }
                p {
                  font-size: 18px;
                  color: #444;
                }
                .footer {
                  position: fixed;
                  bottom: 10px;
                  width: 100%;
                  text-align: center;
                  font-size: 14px;
                  color: #666;
                }
              </style>
            </head>
            <body>
              <h1>🌐 NGINX Load Balancer Demo</h1>
              <h2>Responding Pod: $(hostname)</h2>
              <p>This page was generated dynamically by an initContainer.</p>
              <div class='footer'>Color assigned to this pod: ${COLOR}</div>
            </body>
            </html>" > /workdir/index.html
        volumeMounts:
          - name: html
            mountPath: /workdir
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
          - containerPort: 80
        volumeMounts:
          - name: html
            mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        emptyDir: {}
